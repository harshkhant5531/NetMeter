
name: speed_test
description: A simple and user-friendly internet speed test app built with Flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  gauge_indicator: ^0.4.3
  speed_test_dart: ^1.0.5+0
  http: ^1.4.0
  dart_ping: ^9.0.1
  google_fonts: ^6.2.1
  network_info_plus: ^6.1.4
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.4
  geolocator: ^14.0.1
  google_maps_flutter: ^2.12.3
  percent_indicator: ^4.2.5
  flutter_local_notifications: ^19.3.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/speed_test_logo.jpg"
  adaptive_icon_foreground: "assets/adaptive_android_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/speed_test_logo.jpg  
    - assets/adaptive_android_icon.png
